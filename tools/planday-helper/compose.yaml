services:
  planday-week-helper:
    build: .
    restart: unless-stopped
    environment:
      PLANDAY_PORTAL: ${PLANDAY_PORTAL:-}
      PLANDAY_DEPARTMENT: ${PLANDAY_DEPARTMENT:-}
    volumes:
      - browser:/state
    networks:
      - dokploy-network
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./chromium-seccomp.json
    mem_limit: 1g
    pids_limit: 256
    shm_size: 128mb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  browser:
networks:
  dokploy-network:
    external: true
