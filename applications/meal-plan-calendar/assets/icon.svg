      <stop offset="1" stop-color="#e6e9ef"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a2e"/>
      <stop offset="1" stop-color="#e86a00"/>
