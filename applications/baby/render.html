<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="paperless:epd-optimize" content='{"intent":"readable","canvasDitherOptions":{"ditheringType":"errorDiffusion"}}' />
  <title>Baby</title>
  <link rel="stylesheet" href="/assets/paperless.css" />
  <script src="/assets/paperless.iife.js"></script>
  <style>
    * { box-sizing: border-box; }
    #app { --u:min(.6vw, 1vh); height:100vh; width:100vw; padding:calc(5 * var(--u)); display:flex; flex-direction:column; gap:calc(3 * var(--u)); background:var(--pp-bg); color:var(--pp-fg); }
    h1,h2,p,figure { margin:0; }
    .header { display:flex; flex-shrink:0; justify-content:flex-end; align-items:center; gap:calc(2 * var(--u)); font-size:calc(2.5 * var(--u)); }
    .badge { font-weight:700; }
    .main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.5fr); gap:calc(6 * var(--u)); }
    .hero { min-width:0; min-height:0; display:flex; flex-direction:column; gap:calc(1.1 * var(--u)); }
    .eyebrow { font-size:calc(2.5 * var(--u)); font-weight:750; letter-spacing:.06em; }
    .name { max-width:100%; overflow-wrap:anywhere; }
    .age { font-size:calc(10 * var(--u)); font-weight:800; line-height:1.3; letter-spacing:-.045em; }
    .age-detail { font-size:calc(2.6 * var(--u)); line-height:1.3; }
    .art { flex:1; min-height:0; margin-top:calc(1.2 * var(--u)); background:var(--pp-white); border-radius:calc(2 * var(--u)); padding:calc(1 * var(--u)); display:flex; align-items:center; justify-content:center; }
    .art { flex-direction:column; }
    .art img { display:block; width:100%; height:100%; min-height:0; flex:1; object-fit:contain; }
    .image-fallback { color:var(--pp-black); padding:calc(3 * var(--u)); font-size:calc(3 * var(--u)); }
    .content { min-width:0; min-height:0; display:flex; flex-direction:column; gap:calc(2.3 * var(--u)); padding-top:calc(.4 * var(--u)); }
    .content > * { flex-shrink:0; }
    .content h1 { font-size:calc(5.4 * var(--u)); font-weight:800; line-height:1.3; letter-spacing:-.025em; text-wrap:balance; }
    .reference { font-size:calc(2.6 * var(--u)); font-weight:650; }
    .facts { display:grid; grid-template-columns:1fr 1fr; gap:calc(1.6 * var(--u)) calc(3 * var(--u)); }
    .fact { padding-top:calc(.8 * var(--u)); }
    .fact h2 { font-size:calc(2.7 * var(--u)); margin-bottom:calc(.9 * var(--u)); font-weight:750; }
    .fact p,.description { font-size:calc(3.6 * var(--u)); font-weight:500; line-height:1.32; }
    .description { font-size:calc(4.1 * var(--u)); line-height:1.38; }
    .tip { border-top:1px solid var(--pp-border); padding-top:calc(2.5 * var(--u)); margin-top:auto; }
    .tip h2 { font-size:calc(2.6 * var(--u)); margin-bottom:calc(.6 * var(--u)); }
    .tip p { font-size:calc(3.2 * var(--u)); line-height:1.3; }
    .measurement { display:flex; align-items:center; gap:calc(2.2 * var(--u)); padding:calc(1.5 * var(--u)) 0; }
    .measurement strong { font-size:calc(5.4 * var(--u)); font-weight:800; white-space:nowrap; }
    .measurement span { font-size:calc(2.6 * var(--u)); line-height:1.3; }
    .progress { height:calc(1 * var(--u)); background:var(--pp-bg); border:1px solid var(--pp-border); margin-top:calc(1 * var(--u)); }
    .progress span { height:100%; display:block; background:var(--pp-accent); }
    .footer { flex-shrink:0; border-top:1px solid var(--pp-border); padding-top:calc(1.5 * var(--u)); font-size:calc(2.2 * var(--u)); line-height:1.3; display:flex; flex-direction:column; gap:calc(.7 * var(--u)); }
    .sources { display:flex; flex-wrap:wrap; justify-content:space-between; gap:calc(.4 * var(--u)) calc(2 * var(--u)); font-size:calc(2.05 * var(--u)); }
    a { color:inherit; text-decoration:underline; text-underline-offset:.12em; }
    .alert { font-weight:700; }
    .message { flex:1; min-height:0; display:flex; align-items:center; gap:calc(5 * var(--u)); }
    .message img { width:35%; height:90%; object-fit:contain; background:var(--pp-white); border-radius:calc(2 * var(--u)); }
    .message h1 { font-size:calc(7 * var(--u)); line-height:1.1; margin-bottom:calc(3 * var(--u)); }
    .message p { font-size:calc(4 * var(--u)); line-height:1.4; }
    [data-text-size="big"] .fact p { font-size:calc(3.8 * var(--u)); }
    [data-text-size="big"] .tip p { font-size:calc(3.4 * var(--u)); }
    [data-text-size="small"] .fact p { font-size:calc(3.1 * var(--u)); }
    #app[data-illustration="false"] .main { grid-template-columns:minmax(0,.75fr) minmax(0,1.6fr); }
    #app[data-notes="true"] .content { gap:calc(1.2 * var(--u)); }
    @media (orientation:landscape) {
      #app[data-notes="true"][data-phase="child"] .main { grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr); }
    }
    @media (orientation:portrait) {
      #app { --u:min(1vw, .6vh); padding:calc(4.5 * var(--u)); gap:calc(3.5 * var(--u)); }
      .header { font-size:calc(2.7 * var(--u)); }
      .main { grid-template-columns:1fr; grid-template-rows:minmax(0,.85fr) minmax(0,1.65fr); gap:calc(5 * var(--u)); }
      #app[data-phase="pregnancy"] .main { grid-template-rows:minmax(0,1fr) minmax(0,1.5fr); }
      #app[data-illustration="false"] .main { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); }
      #app[data-illustration="false"] .hero { display:block; }
      .hero { display:grid; grid-template-columns:1fr 1.05fr; grid-template-rows:1fr; column-gap:calc(3 * var(--u)); align-items:center; }
      .hero-copy { display:flex; flex-direction:column; gap:calc(1.5 * var(--u)); }
      .art { height:100%; width:100%; margin:0; }
      .age { font-size:calc(8.8 * var(--u)); }
      .age-detail,.eyebrow { font-size:calc(3 * var(--u)); }
      .content { gap:calc(2.2 * var(--u)); }
      .content h1 { font-size:calc(6.5 * var(--u)); }
      .reference { font-size:calc(3 * var(--u)); }
      .facts { gap:calc(2.5 * var(--u)) calc(3.5 * var(--u)); }
      .fact h2 { font-size:calc(2.9 * var(--u)); }
      .fact p { font-size:calc(3.75 * var(--u)); }
      .tip h2 { font-size:calc(3 * var(--u)); }
      .tip p { font-size:calc(3.6 * var(--u)); }
      .footer { font-size:calc(2.5 * var(--u)); }
      .sources { font-size:calc(2.3 * var(--u)); }
      .description { font-size:calc(4.6 * var(--u)); }
      .measurement strong { font-size:calc(7 * var(--u)); }
      .measurement span { font-size:calc(3 * var(--u)); }
      .message { flex-direction:column; justify-content:center; }
      .message img { width:65%; height:45%; }
    }
  </style>
</head>
<body>
  <div id="website-has-loading-element"></div>
  <main id="app"></main>
  <script type="module" src="./assets/render.js"></script>
</body>
</html>
