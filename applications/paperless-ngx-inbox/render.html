<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="paperless:epd-optimize"
      content='{"intent":"faithful","palette":"spectra6OriginalPalette","canvasDitherOptions":{"ditheringType":"errorDiffusion"}}'
    />
    <title>Paperless-ngx Documents</title>
    <link rel="stylesheet" href="/assets/paperless.css" />
    <script src="/assets/paperless.iife.js"></script>
    <style>
      #app {
        box-sizing: border-box;
        width: 100vw;
        height: 100vh;
        padding: clamp(20px, 3vw, 52px);
        display: flex;
        flex-direction: column;
        gap: clamp(12px, 2vh, 28px);
      }
      header {
        border-bottom: 6px solid var(--pp-accent);
        padding-bottom: 14px;
        flex-shrink: 0;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(28px, 4vw, 58px);
        line-height: 1.1;
        overflow-wrap: anywhere;
      }
      .eyebrow {
        font-size: clamp(12px, 1.5vw, 20px);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 9px;
      }
      #content {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow: hidden;
      }
      .summary {
        font-size: clamp(18px, 2.3vw, 32px);
        font-weight: 700;
        overflow-wrap: anywhere;
        flex-shrink: 0;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(12px, 2vw, 24px);
        align-content: start;
        min-height: 0;
      }
      .entry {
        border: 2px solid var(--pp-border);
        border-top: 7px solid var(--pp-accent);
        padding: clamp(12px, 2vw, 28px);
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .entry h2 {
        font-size: clamp(16px, 2.2vw, 30px);
        line-height: 1.2;
      }
      .value {
        font-size: clamp(25px, 4.5vw, 62px);
        line-height: 1.15;
        font-weight: 800;
        margin-top: 8px;
      }
      .unit {
        font-size: 0.44em;
        margin-left: 7px;
        white-space: nowrap;
      }
      .detail,
      .stamp,
      .caption {
        font-size: clamp(13px, 1.65vw, 23px);
        margin-top: 7px;
        line-height: 1.25;
      }
      .stamp {
        font-variant-numeric: tabular-nums;
      }
      .note {
        font-size: clamp(12px, 1.5vw, 21px);
        line-height: 1.3;
        flex-shrink: 0;
      }
      footer {
        font-size: clamp(11px, 1.4vw, 18px);
        display: flex;
        justify-content: space-between;
        gap: 18px;
        border-top: 1px solid var(--pp-border);
        padding-top: 10px;
        flex-shrink: 0;
      }
      footer span {
        max-width: 60%;
        overflow-wrap: anywhere;
      }
      .tone-orange {
        border-top-color: var(--pp-orange, #ff8000);
      }
      .tone-blue {
        border-top-color: var(--pp-blue);
      }
      .tone-green {
        border-top-color: var(--pp-green);
      }
      .tone-red {
        border-top-color: var(--pp-red);
      }
      @media (orientation: portrait) {
        .cards {
          grid-template-columns: 1fr;
        }
        .entry {
          padding: 16px;
        }
        .value {
          font-size: clamp(34px, 7vw, 70px);
        }
        .entry h2 {
          font-size: clamp(18px, 4vw, 30px);
        }
      }
      @media (min-width: 1200px) {
        .cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-height: 500px) {
        .entry {
          padding: 10px 14px;
        }
        .entry h2 {
          font-size: 17px;
        }
        .value {
          font-size: 30px;
        }
        .detail,
        .stamp,
        .caption {
          font-size: 13px;
          margin-top: 5px;
        }
        .cards {
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="website-has-loading-element"></div>
    <main id="app" aria-live="polite"></main>
    <script type="module" src="./assets/render.js"></script>
  </body>
</html>
