<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="paperless:epd-optimize" content='{"intent":"faithful","palette":"spectra6OriginalPalette","canvasDitherOptions":{"ditheringType":"errorDiffusion"}}' />
    <title>Home Assistant Sensors</title>
    <link rel="stylesheet" href="/assets/paperless.css" />
    <script src="/assets/paperless.iife.js"></script>
    <style>
      #app {
        box-sizing: border-box;
        width: 100vw;
        height: 100vh;
        padding: clamp(20px, 3vw, 54px);
        display: flex;
        flex-direction: column;
        gap: clamp(14px, 2.4vh, 30px);
      }
      header {
        display: flex;
        align-items: center;
        gap: 20px;
        border-bottom: 3px solid var(--pp-fg);
        padding-bottom: 14px;
        flex-shrink: 0;
      }
      header img {
        width: 60px;
        height: 60px;
        object-fit: contain;
      }
      h1 {
        font-size: clamp(27px, 4vw, 58px);
        line-height: 1.1;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .eyebrow {
        font-size: clamp(13px, 1.5vw, 21px);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 0 0 7px;
        color: var(--pp-accent);
      }
      #content {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow: hidden;
      }
      footer {
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: clamp(12px, 1.5vw, 19px);
        border-top: 1px solid var(--pp-border);
        padding-top: 10px;
        overflow-wrap: anywhere;
      }
      footer span {
        max-width: 62%;
      }
      .sample {
        font-weight: 800;
        color: var(--pp-accent);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        padding: 12px 0;
        border-bottom: 1px solid var(--pp-border);
        min-width: 0;
      }
      .row:first-child {
        padding-top: 0;
      }
      .row h2 {
        font-size: clamp(20px, 2.5vw, 35px);
        line-height: 1.15;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .row p {
        font-size: clamp(14px, 1.8vw, 25px);
        line-height: 1.25;
        margin: 6px 0 0;
        overflow-wrap: anywhere;
      }
      .row > div {
        min-width: 0;
      }
      .value {
        font-size: clamp(28px, 4.6vw, 64px);
        font-weight: 800;
        white-space: nowrap;
        line-height: 1.1;
      }
      .unit {
        font-size: 0.43em;
        font-weight: 600;
        margin-left: 5px;
      }
      .badge {
        display: inline-block;
        border: 2px solid var(--pp-fg);
        padding: 3px 7px;
        font-size: clamp(12px, 1.4vw, 18px);
        font-weight: 700;
      }
      .detail {
        color: var(--pp-muted);
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        flex: 1;
        min-height: 0;
      }
      .metric {
        border: 2px solid var(--pp-fg);
        padding: clamp(15px, 2.2vw, 35px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        min-width: 0;
      }
      .metric h2 {
        font-size: clamp(18px, 2.1vw, 32px);
        margin: 0;
      }
      .metric .value {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .metric p {
        margin: 0;
        font-size: clamp(12px, 1.4vw, 20px);
      }
      .hero {
        font-size: clamp(30px, 5vw, 72px);
        margin: 0;
        line-height: 1.05;
      }
      .note {
        font-size: clamp(14px, 1.8vw, 24px);
        margin: 0;
        line-height: 1.3;
      }
      .pills {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        min-height: 0;
        flex: 1;
      }
      .produce {
        border: 2px solid var(--pp-border);
        padding: 12px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        min-width: 0;
      }
      .produce strong {
        font-size: clamp(20px, 2.6vw, 36px);
        overflow-wrap: anywhere;
      }
      .produce small {
        font-size: clamp(12px, 1.4vw, 18px);
      }
      .chart {
        height: 100px;
        min-height: 70px;
        display: flex;
        gap: 8px;
        align-items: flex-end;
        border-bottom: 2px solid var(--pp-fg);
        padding-top: 10px;
      }
      .bar {
        background: var(--pp-accent);
        flex: 1;
        min-height: 2px;
        position: relative;
      }
      .bar span {
        position: absolute;
        bottom: 100%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 12px;
      }
      .error {
        justify-content: center !important;
      }
      .error .hero {
        font-size: 32px;
      }
      .trimmed {
        font-size: 14px;
        margin: 0;
      }
      .headline .row h2 {
        font-size: clamp(20px, 2.7vw, 38px);
      }
      @media (orientation: portrait) {
        header img {
          width: 52px;
          height: 52px;
        }
        #app {
          padding: 24px;
          gap: 20px;
        }
        h1 {
          font-size: clamp(28px, 5.6vw, 58px);
        }
        .pills {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .row {
          padding: 16px 0;
        }
        .row h2 {
          font-size: clamp(22px, 4.8vw, 40px);
        }
        .row p {
          font-size: clamp(16px, 3.3vw, 28px);
        }
        .value {
          font-size: clamp(34px, 7vw, 70px);
        }
        .metrics {
          grid-template-columns: 1fr;
        }
        .metric {
          padding: 18px;
        }
        .metric h2 {
          font-size: 22px;
        }
        .metric .value {
          font-size: 42px;
        }
        .metric p {
          font-size: 14px;
        }
        .chart {
          height: 90px;
          flex-shrink: 0;
        }
        .produce strong {
          font-size: clamp(22px, 4.8vw, 40px);
        }
      }
      @media (min-width: 1000px) and (min-height: 1000px) {
        .chart {
          height: 190px;
        }
        .metric .value {
          font-size: 72px;
        }
        .metric h2 {
          font-size: 32px;
        }
        .metric p {
          font-size: 20px;
        }
        .row {
          padding: 24px 0;
        }
        .bar span {
          font-size: 20px;
        }
      }
      /* Palette accents and dithered orange; text stays on high-contrast surfaces. */
      header {
        border-bottom: 6px solid var(--pp-accent);
      }
      header .eyebrow {
        color: var(--pp-fg);
      }
      .metric {
        border-top: 8px solid var(--pp-accent);
      }
      .metric:nth-child(2) {
        border-top-color: var(--pp-blue);
      }
      .metric:nth-child(3) {
        border-top-color: var(--pp-orange, #ff8000);
      }
      .metric:nth-child(4) {
        border-top-color: var(--pp-green);
      }
      .row {
        border-left: 5px solid var(--pp-accent);
        padding-left: 14px;
      }
      .row .eyebrow {
        color: var(--pp-fg);
      }
      .produce {
        border-top: 7px solid var(--pp-green);
      }
      .produce[data-category="fruit"] {
        border-top-color: var(--pp-orange, #ff8000);
      }
      .produce small {
        color: var(--pp-fg);
      }
      .produce[data-kind="storage"] {
        border-top-style: dashed;
      }
      .warning-level-1 {
        border-left: 9px solid var(--pp-yellow);
      }
      .warning-level-2,
      .warning-level-3 {
        border-left: 9px solid var(--pp-red);
      }
      .warning-label {
        display: inline-block;
        background: var(--pp-orange, #ff8000);
        color: var(--pp-black);
        padding: 5px 9px;
        font-weight: 800;
      }
      .warning-level-1 .warning-label {
        background: var(--pp-yellow);
      }
      .warning-level-3 .warning-label {
        background: var(--pp-red);
        color: var(--pp-white);
      }
      .umami .chart .bar {
        background: var(--pp-blue);
      }
      .umami .chart .bar:last-child {
        background: var(--pp-green);
      }
    #content > .eyebrow { color: var(--pp-fg); }
</style>
  </head>
  <body>
    <div id="website-has-loading-element"></div>
    <main id="app" aria-live="polite"></main>
    <script type="module" src="./assets/render.js"></script>
  </body>
</html>
